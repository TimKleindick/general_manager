# Multi-turn conversations with independent per-turn contracts.

- name: refine_query
  description: Initial broad query followed by a narrowing follow-up
  tier: 0
  tags:
  - follow_up
  - single_manager_query
  - grounded_answer
  conversation:
  - user: Show me all parts
  - user: Now just show me the ones that use Steel
  expectations:
    contract:
      category: follow_up
      hard:
        required_tool_calls:
        - name: query
          args_contain:
            manager: PartManager
        forbidden_tools:
        - mutate
        results_contain:
        - Bolt
        answer_contains:
        - Bolt
    tool_calls:
    - name: query
      args_contain:
        manager: PartManager
    - name: query
      args_contain:
        manager: PartManager
    results_contain:
    - Bolt
    answer_contains:
    - Bolt
    turns:
    - result_set:
        manager: PartManager
        rows:
        - name: Bolt
        - name: Bearing
        - name: Gear
      answer_contains:
      - Bolt
      - Bearing
      - Gear
      answer_excludes: []
    - result_set:
        manager: PartManager
        rows:
        - name: Bolt
      answer_contains:
      - Bolt
      answer_excludes:
      - Bearing
      - Gear
- name: explore_then_query
  description: Schema exploration turn followed by a data query turn
  tier: 0
  tags:
  - follow_up
  - schema_inspection
  - single_manager_query
  - grounded_answer
  conversation:
  - user: Tell me about the MaterialManager schema
  - user: Great, now list all materials with density above 7
  expectations:
    contract:
      category: follow_up
      hard:
        required_tool_calls:
        - name: get_manager_schema
          args_contain:
            manager: MaterialManager
        - name: query
          args_contain:
            manager: MaterialManager
        forbidden_tools:
        - mutate
        results_contain:
        - Steel
        answer_contains:
        - Steel
    tool_calls:
    - name: get_manager_schema
      args_contain:
        manager: MaterialManager
    - name: query
      args_contain:
        manager: MaterialManager
    results_contain:
    - Steel
    answer_contains:
    - Steel
    turns:
    - contract:
        category: schema_inspection
        hard:
          required_tool_calls:
          - name: get_manager_schema
            args_contain:
              manager: MaterialManager
    - result_set:
        manager: MaterialManager
        rows:
        - name: Steel
        - name: Cobalt
      answer_contains:
      - Steel
      - Cobalt
      answer_excludes:
      - Aluminum
- name: pronoun_reference
  description: Follow-up uses a pronoun referring to a previous result
  tier: 0
  tags:
  - follow_up
  - relation_traversal
  - grounded_answer
  conversation:
  - user: Find the Cobalt material
  - user: What parts use it?
  expectations:
    contract:
      category: follow_up
      hard:
        required_tool_calls:
        - name: query
          args_contain:
            manager: MaterialManager
        - name: query
          args_contain:
            manager: PartManager
        forbidden_tools:
        - mutate
        results_contain:
        - Cobalt
        - Gear
        answer_contains:
        - Cobalt
        - Gear
      strategy:
        recommended_tool_calls:
        - name: find_path
        strict_order: false
    tool_calls:
    - name: query
      args_contain:
        manager: MaterialManager
    - name: query
      args_contain:
        manager: PartManager
    results_contain:
    - Cobalt
    - Gear
    answer_contains:
    - Cobalt
    - Gear
    turns:
    - result_set:
        manager: MaterialManager
        rows:
        - name: Cobalt
      answer_contains:
      - Cobalt
      answer_excludes:
      - Steel
      - Aluminum
    - result_set:
        manager: PartManager
        rows:
        - name: Gear
      answer_contains:
      - Gear
      answer_excludes:
      - Bolt
      - Bearing
