# Proposal only: not installed, committed, pushed, or triggered.
# After explicit authorization, add on the reviewed feature branch.
name: Verify MariaDB 3.13 fix
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  backend:
    name: MariaDB 11.8 / Python 3.13 / repetition ${{ matrix.repetition }}
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    uses: ./.github/workflows/database-backend-tests.yml
    with:
      python-version: '3.13'
      database-label: MariaDB 11.8 LTS
      database-selector: mariadb
      database-image: mariadb:11.8
      database-port: 3306
      database-user: root
      database-driver: mysqlclient>=2.2,<3
      database-health-command: healthcheck.sh --connect --innodb_initialized
